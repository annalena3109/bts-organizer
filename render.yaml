services:
  # Web Service hosting Node/Express API and React Frontend
  - type: web
    name: backtoschool-app
    runtime: node
    plan: free
    buildCommand: npm install && npm install --prefix client && npm install --prefix server && npm run build --prefix client
    startCommand: npm start --prefix server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: backtoschool-db
          property: connectionString

databases:
  # Render Managed PostgreSQL Database
  - name: backtoschool-db
    plan: free
    databaseName: backtoschool
    user: backtoschool_user
