services:
  # Web Service hosting Node/Express API and React Frontend (Free tier on Render)
  - type: web
    name: backtoschool-app
    runtime: node
    plan: free
    buildCommand: npm install && npm install --prefix client && npm install --prefix server && npm run build --prefix client
    startCommand: npm start --prefix server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      # Turso Serverless Database Credentials (Free Forever, 9 GB storage)
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
